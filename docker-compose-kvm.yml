services:
  spr-tamago-demo:
    extends:
      file: docker-compose.yml
      service: spr-tamago-demo
    image: ghcr.io/spr-networks/spr-tamago-demo:latest
    build: !reset null
    runtime: ${SPR_KRUN_RUNTIME:-spr-krun}
    annotations:
      krun.cpus: "1"
      krun.ram_mib: "256"
      krun.kernel_path: "/tamago-kernel"
      krun.kernel_format: "0"
      krun.tap_name: "kruntap0"
      krun.net_uplink: "eth0"
      krun.vsock_path: "/state/plugins/spr-tamago-demo/socket.sock"
      krun.vsock_port: "4040"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    devices:
      - "/dev/net/tun:/dev/net/tun"

networks:
  tamagonet:
    name: spr-tamago-demo
    driver_opts:
      com.docker.network.bridge.name: spr-tamago-demo
      com.docker.network.bridge.inhibit_ipv4: "true"
