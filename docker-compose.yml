x-labels:
  &default-labels
  org.supernetworks.ci: "true"
  org.supernetworks.version: ${RELEASE_VERSION:-latest}${RELEASE_CHANNEL:-}

services:
  spr-tamago-demo:
    container_name: spr-tamago-demo
    platform: linux/arm64
    image: ghcr.io/spr-networks/spr-tamago-demo:latest
    # Prefer an image built and loaded on the SPR host. Set PULL_POLICY=always
    # explicitly when a published release should replace the local image.
    pull_policy: ${PULL_POLICY:-missing}
    build:
      context: "${BUILDCTX:-.}"
      target: kernel
      args:
        NODE_REF: ${NODE_REF:-node:18@sha256:c6ae79e38498325db67193d391e6ec1d224d96c693a8a4d943498556716d3783}
        GO_REF: ${GO_REF:-docker.io/library/golang:1.26.4-bookworm@sha256:b305420a68d0f229d91eb3b3ed9e519fcf2cf5461da4bef997bf927e8c0bfd2b}
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}
        YARN_VERSION: ${YARN_VERSION:-1.22.22}
        PLUGIN_UI_COMMIT: ${PLUGIN_UI_COMMIT:-05f5961ec472b10392c5fe85c6bcc4860a64dbd0}
        TAMAGO_VERSION: ${TAMAGO_VERSION:-v1.26.5-0.20260626120227-bb8159e64f82}
        TAMAGO_GO_VERSION: ${TAMAGO_GO_VERSION:-tamago-go1.26.4}
        TAMAGO_GO_COMMIT: ${TAMAGO_GO_COMMIT:-c6c7dc072c5248c9b668d4ad0af1d7653eb3cfa5}
        GO_NET_VERSION: ${GO_NET_VERSION:-v0.0.0-20260714134120-c2c964e7084c}
      labels: *default-labels
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - tamagonet

networks:
  tamagonet:
    name: spr-tamago-demo
    driver_opts:
      com.docker.network.bridge.name: spr-tamago-demo
      com.docker.network.bridge.inhibit_ipv4: "true"
